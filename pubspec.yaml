# Workspace root (spec 0011). Holds no code: it only ties the apps and the
# shared package together so `flutter pub get` resolves them as one set with
# one pubspec.lock. Run apps from their own folder, e.g. `cd apps/buyer`.
name: shopscroll_workspace
publish_to: 'none'

environment:
  sdk: ^3.12.2

workspace:
  - apps/buyer
  - packages/shared
